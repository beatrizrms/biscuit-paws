<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Biscuit Paws</title>
    <!-- Celular: "Adicionar à tela de início" abre o jogo como app, sem a barra do navegador. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#2b1d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biscuit Paws" />
    <style>
      html, body { margin: 0; height: 100%; background: #2b1d1a; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; }
      #stage canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game">
      <div id="stage"><div id="ui"></div><div id="touch"></div></div>
    </div>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
